
name: Build MW Music APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Extract Android project ZIP
        run: |
          unzip -o DOC-20261024-WA0000.zip -d .
          test -d app
          test -f settings.gradle.kts
          echo "Android project files found"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build APK
        run: gradle --no-daemon clean :app:assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: MW-Music-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
